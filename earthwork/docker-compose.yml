version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: earthwork
      POSTGRES_PASSWORD: earthwork
      POSTGRES_DB: earthwork
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthwork -d earthwork"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      EW_PG_DSN: "postgresql://earthwork:earthwork@db:5432/earthwork"
    ports:
      - "8765:8765"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8765"]

volumes:
  pgdata:
